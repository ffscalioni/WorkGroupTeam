<div id="modalNovaTarefa" class="modal-backdrop hidden">
  <div class="modal-box">
    <h3 style="margin-top:0;color:var(--primary);">➕ Incluir Nova Atividade</h3>
    <div class="field" style="margin-bottom:10px;">
      <label>Descrição da Atividade</label>
      <input type="text" id="modTituloTarefa" placeholder="O que precisa ser feito?">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div class="field"><label>Projeto / Iniciativa</label><select id="modProjetoTarefa"></select></div>
      <div class="field"><label>Responsável</label><select id="modRespTarefa"></select></div>
      <div class="field"><label>Data Início (ou Futura)</label><input type="date" id="modInicioTarefa"></div>
      <div class="field"><label>Prazo Final</label><input type="date" id="modPrazoTarefa"></div>
      <div class="field"><label>Prioridade</label>
        <select id="modPrioTarefa"><option>Alta</option><option selected>Média</option><option>Baixa</option></select>
      </div>
      <div class="field"><label>⛓️ Depende de qual Tarefa?</label><select id="modDepTarefa"></select></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="tab-btn" onclick="fecharModalNovaTarefa()">Cancelar</button>
      <button class="btn-primario" onclick="confirmarCriacaoTarefa()">Salvar Tarefa</button>
    </div>
  </div>
</div>
