<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dicionário de Dados Regulatórios</title>
<style>
  :root{--primary:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--purple:#7c3aed}
  *{box-sizing:border-box;font-family:'Inter','Segoe UI',Roboto,Helvetica,sans-serif}
  body{margin:0;background:var(--bg);color:var(--text);font-size:13px}
  header{background:#0f172a;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header .tit{font-size:17px;font-weight:700}
  header .sub{font-size:11px;color:#94a3b8}
  header a,header button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:7px 12px;font-size:12px;text-decoration:none;cursor:pointer}
  .tabs{display:flex;gap:6px;padding:12px 24px 0}
  .tab{background:transparent;border:1px solid transparent;border-bottom:none;padding:9px 16px;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted);cursor:pointer;font-size:13px}
  .tab.on{background:var(--card);border-color:var(--border);color:var(--primary)}
  main{padding:0 24px 24px}
  .box{background:var(--card);border:1px solid var(--border);border-radius:0 12px 12px 12px;padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#f8fafc}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:3px;min-width:150px}
  .f label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
  input,select,textarea{border:1px solid #cbd5e1;border-radius:7px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--text);width:100%}
  textarea{min-height:58px;resize:vertical}
  button.pri{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:12.5px}
  button.sec{background:#fff;color:var(--text);border:1px solid #cbd5e1;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12.5px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .tblwrap{overflow:auto;max-height:62vh;border:1px solid var(--border);border-radius:10px}
  table{border-collapse:collapse;width:100%}
  th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#eff6ff}
  tbody tr.sel{background:#dbeafe}
  .bdg{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-info{background:#dbeafe;color:#1e40af}
  .b-cde{background:#ede9fe;color:#5b21b6}.b-mut{background:#f1f5f9;color:#64748b}.b-dan{background:#fee2e2;color:#991b1b}
  .tblwrap{max-height:calc(100vh - 290px)}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:8}
  .modal-box{background:#f8fafc;border-radius:12px;width:min(980px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .modal-top{display:flex;justify-content:flex-end;padding:8px 10px 0}
  .modal-top button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
  .det{padding:0 18px 18px;overflow:auto}
  .det h3{margin:0 0 4px;font-size:15px}
  .det .mut{color:var(--muted);font-size:11.5px;margin-bottom:10px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .sec-t{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--primary);margin:14px 0 6px;letter-spacing:.04em}
  .lin{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-bottom:6px}
  .no{flex:1;min-width:120px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px;word-break:break-word;overflow-wrap:anywhere}
  .no small{display:block;font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
  .no.fim{border-color:var(--primary);background:#eff6ff}
  .seta{align-self:center;padding:0 6px;color:var(--muted);font-size:16px}
  .chk{background:#fff;border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:8px;padding:8px 10px;margin-bottom:6px}
  .chk .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:3px}
  .cam{border:1px dashed #cbd5e1;border-radius:8px;padding:8px;background:#fff}
  .cam-t{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
  .cam-seta{text-align:center;color:var(--muted);font-size:13px;line-height:1.3}
  .pas{border-left:3px solid var(--primary);padding:5px 8px;margin-bottom:6px;background:#f8fafc;border-radius:0 6px 6px 0}
  .pas:last-child{margin-bottom:0}
  .pas .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .pas code{background:#e0e7ff;color:#1e3a8a;padding:1px 5px;border-radius:4px;font-size:11.5px;word-break:break-all}
  .pas .desc{font-size:11.5px;color:#334155;margin-top:3px;word-break:break-word}
  .pas .fonte{font-size:10px;color:var(--muted);margin-top:2px}
  .vazio{color:var(--muted);padding:24px;text-align:center}
  #toast{position:fixed;bottom:18px;right:18px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;display:none;z-index:9}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div>
    <div class="tit">📚 Dicionário de Dados Regulatórios</div>
    <div class="sub" id="lblUsuario">Carregando...</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <a id="lnkPlanilha" class="hidden" target="_blank" href="#">📊 Abrir base</a>
    <a id="lnkPortal" target="_top" href="#">⇄ Trocar módulo</a>
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-aba="regs">🗂️ Inventário de Regulatórios</button>
  <button class="tab" data-aba="campos">🧬 Campos, Lineage & Data Quality</button>
</div>

<main>
  <!-- ABA 1: INVENTÁRIO DE REGULATÓRIOS -->
  <div class="box" id="aba-regs">
    <div class="kpis" id="kpisRegs"></div>
    <div class="filtros">
      <div class="f"><label>Estado</label><select id="fRegEstado"></select></div>
      <div class="f"><label>Regulador</label><select id="fRegRegulador"></select></div>
      <div class="f"><label>Área</label><select id="fRegArea"></select></div>
      <div class="f" style="flex:1;min-width:200px"><label>Busca</label><input id="fRegBusca" placeholder="Código, nome, sistema, responsável..."></div>
      <button class="pri" id="btnNovoReg">+ Novo regulatório</button>
    </div>
    <div class="tblwrap"><table>
      <thead><tr><th>Cód.</th><th>Reporte</th><th>Regulador</th><th>Tipo</th><th>Estado</th><th>Sistema fonte</th><th>Report Owner</th><th>Resp. pelo envio</th><th>Data Owner</th><th>Campos / CDE</th></tr></thead>
      <tbody id="tbRegs"></tbody>
    </table></div>
  </div>

  <!-- ABA 2: CAMPOS POR REPORTE -->
  <div class="box hidden" id="aba-campos">
    <div class="kpis" id="kpisCampos"></div>
    <div class="filtros">
      <div class="f" style="min-width:260px"><label>Reporte</label><select id="fCampoRep"></select></div>
      <div class="f"><label>CDE</label><select id="fCampoCde"><option value="">Todos</option><option value="Sim">Somente CDE</option><option value="Não">Não CDE</option></select></div>
      <div class="f"><label>Data Owner</label><select id="fCampoOwner"><option value="">Todos</option><option value="__SEM__">Sem Data Owner</option></select></div>
      <div class="f"><label>Status no ADA</label><select id="fCampoAda"><option value="">Todos</option></select></div>
      <div class="f" style="flex:1;min-width:200px"><label>Busca</label><input id="fCampoBusca" placeholder="Dado, atributo, bloco, sistema..."></div>
      <button class="pri" id="btnNovoCampo">+ Novo campo</button>
    </div>
    <div class="tblwrap"><table>
      <thead><tr><th>ID</th><th>Bloco</th><th>Dado</th><th>Campo no layout</th><th>CDE</th><th>Data Owner</th><th>ADA</th><th>Lineage</th><th>DQ</th></tr></thead>
      <tbody id="tbCampos"></tbody>
    </table></div>
  </div>
</main>
<!-- Popups de edição e inclusão -->
<div class="modal hidden" id="mdReg"><div class="modal-box"><div class="modal-top"><button type="button" data-fechar="mdReg" title="Fechar (Esc)">✕</button></div><div class="det" id="detReg"></div></div></div>
<div class="modal hidden" id="mdCampo"><div class="modal-box"><div class="modal-top"><button type="button" data-fechar="mdCampo" title="Fechar (Esc)">✕</button></div><div class="det" id="detCampo"></div></div></div>
<div id="toast"></div>

    const atual = sel.value;
    sel.innerHTML = `<option value="">${esc(rotuloTodos)}</option>` + valores.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = atual;
  }
  function bdgEstado(e) {
    const c = e === 'Reportando' ? 'b-ok' : e === 'Condicional' ? 'b-warn' : e === 'Em andamento' ? 'b-info' : 'b-mut';
    return `<span class="bdg ${c}">${esc(e || '-')}</span>`;
  }
  function ehCondicional(r) { return r.estado === 'Condicional' || String(r.condicao || '').trim() !== ''; }
  /** Campo ainda sem Data Owner: vazio ou marcado como pendente na planilha do banco. */
  function semDataOwner(c) { const o = String(c.dataOwner || '').trim(); return !o || /^pendente$/i.test(o); }
  function bdgAda(s) {
    if (!s) return '<span class="bdg b-mut">—</span>';
    const c = s === 'Enviado' ? 'b-ok' : s === 'Parcial' ? 'b-info' : s === 'Equivalente a validar' ? 'b-warn' : s === 'Não enviado' ? 'b-dan' : 'b-mut';
    return `<span class="bdg ${c}">${esc(s)}</span>`;
  }

  /* ---------- persistência ---------- */
  function salvarDemo() {
    if (TEM_SERVIDOR) return;
    // Em pré-visualizações sem armazenamento local a edição vale só enquanto a página estiver aberta
    try { localStorage.setItem(CHAVE_DEMO, JSON.stringify({ regs: DD.regs, campos: DD.campos, checks: DD.checks, lineage: DD.lineage })); } catch (e) {}
  }
  /* Cache local do navegador (mesmo padrão do Workgroup):
     1. abre na hora com a última cópia salva neste navegador;
     2. busca o estado na RAM do servidor e substitui a cópia;
     3. a cada 30s consulta só a versão e recarrega se alguém alterou algo. */
  const CHAVE_CACHE_LOCAL = 'DD_HUB_V4_CACHE';
  let OPERACOES_EM_BACKGROUND = 0;

  function salvarCacheLocal() {
    if (!TEM_SERVIDOR) return;
    try { localStorage.setItem(CHAVE_CACHE_LOCAL, JSON.stringify(DD)); } catch (e) {} // sem espaço: segue só com a RAM do servidor
  }
  function aplicarEstado(res) {
    Object.assign(DD, res);
    DD.versaoCache = String(DD.versaoCache || '0');
    $('lblUsuario').innerText = `${DD.usuarioEmail} · Perfil ${DD.perfil}` + (DD.podeEditar ? '' : ' (somente leitura; pode incluir data quality checks)');
    if (DD.urlApp) $('lnkPortal').href = DD.urlApp;
    if (DD.planilhaUrl) { $('lnkPlanilha').href = DD.planilhaUrl; $('lnkPlanilha').classList.remove('hidden'); }
    iniciarTela();
  }
  function chamar(nomeFn, arg, aoTerminar) {
    if (!TEM_SERVIDOR) { salvarDemo(); toast('Salvo (modo demonstração local)'); if (aoTerminar) aoTerminar(); return; }
    // A tela já mudou (atualização otimista); grava a cópia local e envia ao servidor em segundo plano
    salvarCacheLocal();
    OPERACOES_EM_BACKGROUND++;
    google.script.run
      .withSuccessHandler(res => {
        OPERACOES_EM_BACKGROUND = Math.max(0, OPERACOES_EM_BACKGROUND - 1);
        if (res && res.versaoCache) { DD.versaoCache = String(res.versaoCache); salvarCacheLocal(); }
        toast('Salvo na base do Dicionário');
        if (aoTerminar) aoTerminar();
      })
      .withFailureHandler(err => {
        OPERACOES_EM_BACKGROUND = Math.max(0, OPERACOES_EM_BACKGROUND - 1);
        alert('Não foi possível salvar: ' + err.message);
        sincronizarComServidor(); // desfaz a mudança local trazendo o estado real
      })
      [nomeFn](arg);
  }
  function sincronizarComServidor() {
    google.script.run
      .withSuccessHandler(res => { aplicarEstado(res); salvarCacheLocal(); })
      .withFailureHandler(err => { $('lblUsuario').innerText = err.message; alert(err.message); })
      .apiDDObterEstado();
  }
  function verificarAtualizacaoSilenciosa() {
    if (OPERACOES_EM_BACKGROUND > 0) return;
    google.script.run.withSuccessHandler(res => {
      if (res && String(res.versaoCache) !== String(DD.versaoCache) && OPERACOES_EM_BACKGROUND === 0) sincronizarComServidor();
    }).apiDDVerificarVersaoCache();
  }
  function carregar() {
    if (!TEM_SERVIDOR) {
      let salvo = null;
      try { salvo = JSON.parse(localStorage.getItem(CHAVE_DEMO) || 'null'); } catch (e) {}
      Object.assign(DD, JSON.parse(JSON.stringify(DD_SEED)), salvo || {});
      $('lblUsuario').innerText = 'Modo demonstração local (dados da planilha Inventario_RC18)';
      iniciarTela();
      return;
    }
    let local = null;
    try { local = JSON.parse(localStorage.getItem(CHAVE_CACHE_LOCAL) || 'null'); } catch (e) {}
    if (local && Array.isArray(local.regs)) aplicarEstado(local);
    sincronizarComServidor();
    if (!carregar._polling) carregar._polling = setInterval(verificarAtualizacaoSilenciosa, 30000);
  }

  /* ---------- montagem ---------- */
  function iniciarTela() {
    opcoes($('fRegEstado'), unicos(DD.regs.map(r => r.estado)), 'Todos');
    opcoes($('fRegRegulador'), unicos(DD.regs.map(r => r.regulador)), 'Todos');
    opcoes($('fRegArea'), unicos(DD.regs.map(r => r.area)), 'Todas');
    const selRep = $('fCampoRep'), atual = selRep.value;
    const cods = unicos(DD.campos.map(c => c.codReporte));
    selRep.innerHTML = '<option value="">Todos os reportes</option>' + cods.map(c => {
      const r = DD.regs.find(x => x.cod === c);
      const n = DD.campos.filter(x => x.codReporte === c).length;
      return `<option value="${esc(c)}">${esc(c)} — ${esc(r ? r.nome : '')} (${n})</option>`;
    }).join('');
    selRep.value = atual || (cods.indexOf('3040') > -1 ? '3040' : '');
    const selOwn = $('fCampoOwner'), ownAtual = selOwn.value;
    selOwn.innerHTML = '<option value="">Todos</option><option value="__SEM__">Sem Data Owner</option>' +
      unicos(DD.campos.map(c => c.dataOwner)).map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
    selOwn.value = ownAtual;
    opcoes($('fCampoAda'), unicos(DD.campos.map(c => c.statusAda)), 'Todos');
    $('btnNovoReg').disabled = !DD.podeEditar;
    $('btnNovoCampo').disabled = !DD.podeEditar;
    renderRegs(); renderCampos();
  }

  function salvarReg(existente) {
    const reg = Object.assign({}, existente || {});
    CAMPOS_REG.forEach(c => { reg[c[0]] = $('r_' + c[0]).value.trim(); });

  /* ---------- ABA 2: campos, lineage e data quality ---------- */
  function checksDoCampo(c) { return DD.checks.filter(k => k.idCampo === c.id); }
  function lineageDoCampo(c) {
    return (DD.lineage || []).filter(l => l.idCampo === c.id).sort((a, b) => Number(a.ordem) - Number(b.ordem));
  }
  /** Referência técnica do passo: tabela.coluna (ou Bloco/@Atributo, quando é o layout do arquivo). */
  function refLineage(l) {
    if (!l.tabela && !l.coluna) return '';
    if (l.camada === 'LAYOUT') return l.tabela + (l.coluna ? '/' + l.coluna : '');
    return l.tabela + (l.coluna ? '.' + l.coluna : '');
  }
  function htmlLineage(c) {
    const passos = lineageDoCampo(c);
    if (!passos.length) return '<div class="mut">Nenhum passo de lineage cadastrado para este campo.</div>';
    const blocos = CAMADAS.map(cam => {
      const itens = passos.filter(l => l.camada === cam[0]);
      if (!itens.length) return '';
      return `<div class="cam"><div class="cam-t">${esc(cam[1])}</div>${itens.map(l => {
        const ref = refLineage(l);
        return `<div class="pas">
          <div class="top"><span><b>${esc(l.sistema)}</b>${ref ? ` <code>${esc(ref)}</code>` : ''}</span>
            ${DD.podeEditar ? `<button class="sec" data-del-lin="${esc(l.id)}" style="padding:1px 7px" title="Remover este passo">🗑️</button>` : ''}</div>
          ${l.descricao ? `<div class="desc">${esc(l.descricao)}</div>` : ''}
          ${l.fonte ? `<div class="fonte">Fonte: ${esc(l.fonte)}</div>` : ''}
        </div>`;
      }).join('')}</div>`;
    }).filter(Boolean);
    return blocos.join('<div class="cam-seta">▼</div>');
  }
  function renderCampos() {

      (!fC || c.cde === fC) && (!fO || (fO === '__SEM__' ? semDataOwner(c) : c.dataOwner === fO)) && (!fA || c.statusAda === fA) &&

      <div class="kpi"><b>${DD.checks.filter(k => !fR || k.codReporte === fR).length}</b><span>Data quality checks</span></div>`;

      <td>${semDataOwner(c) ? `<span class="bdg b-dan">${c.dataOwner ? 'pendente' : 'definir'}</span>` : esc(c.dataOwner)}</td>

  function proximoId(prefixo, lista) {

      <div class="sec-t">Cadastro do campo</div>
      <div class="g2">
        <div class="f"><label>Dado</label><input id="c_dado" value="${esc(c.dado || '')}" ${ro}></div>

        <div class="f"><label>Bloco</label><input id="c_bloco" value="${esc(c.bloco || '')}" ${ro}></div>
        <div class="f"><label>É CDE (dado crítico)?</label><select id="c_cde" ${ro}><option ${c.cde === 'Sim' ? 'selected' : ''}>Sim</option><option ${c.cde !== 'Sim' ? 'selected' : ''}>Não</option></select></div>
        <div class="f"><label>Data Owner (accountable)</label><input id="c_dataOwner" value="${esc(c.dataOwner || '')}" ${ro} placeholder="Quem responde por este dado"></div>
        <div class="f"><label>Data Owner definido?</label><select id="c_ownerConfirmado" ${ro}>${['', 'Sim', 'Não', 'N/A'].map(v => `<option value="${v}" ${(c.ownerConfirmado || '') === v ? 'selected' : ''}>${v || '—'}</option>`).join('')}</select></div>
        <div class="f"><label>SLO (delegate)</label><input id="c_slo" value="${esc(c.slo || '')}" ${ro} placeholder="Delegado do Data Owner"></div>
        <div class="f"><label>Report Owner</label><input id="c_reportOwner" value="${esc(c.reportOwner || '')}" ${ro}></div>
        <div class="f"><label>Sistema fonte</label><input id="c_sistemaFonte" value="${esc(c.sistemaFonte || '')}" ${ro}></div>
        <div class="f"><label>Tabela / campo de origem</label><input id="c_campoOrigem" value="${esc(c.campoOrigem || '')}" ${ro} placeholder="Ex.: Matera · TABELA.CAMPO"></div>
        <div class="f"><label>Origem do dado</label><input id="c_origem" value="${esc(c.origem || '')}" ${ro} placeholder="Sistema, Calculado, Tabela/Domínio..."></div>
        <div class="f"><label>Área responsável</label><input id="c_area" value="${esc(c.area || '')}" ${ro}></div>
      </div>
      <div class="f" style="margin-bottom:8px"><label>Regra de apuração / transformação</label>
        <textarea id="c_regra" ${ro} placeholder="Descreva a regra aplicada ao dado...">${esc(c.regra || '')}</textarea></div>
      <div class="f" style="margin-bottom:8px"><label>Regra de negócio (data definition)</label>
        <textarea id="c_definicao" ${ro} placeholder="Definição de negócio do dado...">${esc(c.definicao || '')}</textarea></div>
      <div class="sec-t">ADA (data lake) ${bdgAda(c.statusAda)}</div>
      <div class="g2">
        <div class="f"><label>Status no ADA</label><select id="c_statusAda" ${ro}>${['', 'Enviado', 'Parcial', 'Equivalente a validar', 'Não enviado', 'Não se aplica'].map(v => `<option value="${v}" ${(c.statusAda || '') === v ? 'selected' : ''}>${v || '—'}</option>`).join('')}</select></div>
        <div class="f"><label>Campo no ADA (arquivo.campo)</label><input id="c_campoAda" value="${esc(c.campoAda || '')}" ${ro}></div>
      </div>
      <div class="f" style="margin-bottom:8px"><label>Origem do campo no ADA (coluna do Matera usada pelo KBTQ/KSAN)</label><input id="c_origemAda" value="${esc(c.origemAda || '')}" ${ro}></div>
      <div class="f" style="margin-bottom:8px"><label>Observações e anotações de reunião</label>
        <textarea id="c_observacoes" ${ro}>${esc(c.observacoes || '')}</textarea></div>
      <button class="pri" id="btnSalvarCampo" ${ro}>💾 Salvar campo</button>
      ${novo ? '' : `
      <div class="sec-t">Data quality checks (${ks.length})</div>
      <div id="listaChecks">${ks.map(k => `
        <div class="chk">
          <div class="top"><span><span class="bdg b-cde">${esc(k.tipo || 'Validação')}</span> <b>${esc(k.id)}</b>
            ${k.prioridade ? `<span class="bdg ${k.prioridade === 'Alta' ? 'b-dan' : 'b-mut'}">${esc(k.prioridade)}</span>` : ''}</span>
            ${DD.podeEditar ? `<button class="sec" data-del="${esc(k.id)}" style="padding:2px 8px">🗑️</button>` : ''}</div>
          <div>${esc(k.descricao)}</div>
          ${k.base || k.origem ? `<div class="mut" style="margin:4px 0 0">${k.base ? 'Base: ' + esc(k.base) + ' · ' : ''}Origem: ${esc(k.origem || '-')}</div>` : ''}
        </div>`).join('') || '<div class="mut">Nenhum data quality check cadastrado para este campo.</div>'}</div>
      <div class="g2" style="margin-top:8px">
        <div class="f"><label>Tipo / dimensão</label><select id="k_tipo">${['Completude', 'Unicidade', 'Acurácia', 'Consistência', 'Validade', 'Tempestividade', 'Integridade', 'Rastreabilidade'].map(t => `<option>${t}</option>`).join('')}</select></div>
        <div class="f"><label>Prioridade</label><select id="k_prioridade"><option>Alta</option><option selected>Média</option><option>Baixa</option></select></div>
      </div>
      <div class="f" style="margin-bottom:8px"><label>Descrição do data quality check</label>
        <textarea id="k_descricao" placeholder="Descreva em texto o que este check valida e como..."></textarea></div>
      <button class="pri" id="btnAddCheck">+ Adicionar data quality check</button>`}`;
    $('btnSalvarCampo').onclick = () => salvarCampo(c, novo);
    if (!novo) {
      if ($('btnAddLin')) $('btnAddLin').onclick = () => adicionarLineage(c);
      $('listaLineage').onclick = ev => {
        const alvo = ev.target.closest ? ev.target.closest('[data-del-lin]') : null;
        const idDel = alvo && alvo.getAttribute('data-del-lin');
        if (idDel && confirm('Remover o passo de lineage ' + idDel + '?')) {
          DD.lineage = DD.lineage.filter(l => l.id !== idDel);
          chamar('apiDDExcluirLineage', idDel);
          abrirCampo(c.id); renderCampos();
        }
      };
      $('btnAddCheck').onclick = () => adicionarCheck(c);
      $('listaChecks').onclick = ev => {
        const idDel = ev.target.getAttribute && ev.target.getAttribute('data-del');
        if (idDel && confirm('Excluir o data quality check ' + idDel + '?')) {
          DD.checks = DD.checks.filter(k => k.id !== idDel);
          chamar('apiDDExcluirCheck', idDel);
          abrirCampo(c.id); renderCampos();
        }
      };
    }
    abrirModal('mdCampo');
    renderCampos();
  }
  function salvarCampo(c, novo) {
    ['dado', 'atributo', 'bloco', 'cde', 'dataOwner', 'ownerConfirmado', 'slo', 'reportOwner', 'sistemaFonte', 'campoOrigem', 'origem', 'area', 'regra',
     'definicao', 'statusAda', 'campoAda', 'origemAda', 'observacoes']
      .forEach(k => { c[k] = $('c_' + k).value.trim(); });
    if (!c.dado) return alert('Informe o nome do dado.');
    if (novo) { c.status = 'Cadastrado manualmente'; DD.campos.push(c); }
    chamar('apiDDSalvarCampo', c);
    fecharModal('mdCampo'); iniciarTela(); toast('Campo salvo.');
  }
  function adicionarLineage(c) {
    const sistema = $('l_sistema').value.trim();
    if (!sistema) return alert('Informe o sistema deste passo do lineage.');
    const camada = $('l_camada').value;
    const passo = { id: proximoId('LN', DD.lineage), idCampo: c.id, codReporte: c.codReporte, camada,
                    ordem: String(CAMADAS.findIndex(x => x[0] === camada) + 1), sistema,
                    tabela: $('l_tabela').value.trim(), coluna: $('l_coluna').value.trim(),
                    descricao: $('l_descricao').value.trim(), fonte: 'Cadastro manual' };
    DD.lineage.push(passo);
    chamar('apiDDSalvarLineage', passo);
    abrirCampo(c.id); renderCampos();
  }
  function adicionarCheck(c) {
    const descricao = $('k_descricao').value.trim();
    if (!descricao) return alert('Descreva o data quality check.');
    const k = { id: proximoId('DQ', DD.checks), idCampo: c.id, codReporte: c.codReporte, tipo: $('k_tipo').value,
                descricao, base: '', prioridade: $('k_prioridade').value, origem: 'Cadastro manual' };
    DD.checks.push(k);
    chamar('apiDDSalvarCheck', k);
    abrirCampo(c.id); renderCampos();
  }

  /* ---------- popups ---------- */
  function abrirModal(id) { $(id).classList.remove('hidden'); }
  function fecharModal(id) {
    $(id).classList.add('hidden');
    if (id === 'mdReg') { regSel = null; renderRegs(); } else { campoSel = null; renderCampos(); }
  }
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', ev => {
    if (ev.target === m || ev.target.getAttribute('data-fechar')) fecharModal(m.id);
  }));
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') document.querySelectorAll('.modal:not(.hidden)').forEach(m => fecharModal(m.id));
  });

  /* ---------- navegação e eventos ---------- */
  function trocarAba(aba) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.getAttribute('data-aba') === aba));
    $('aba-regs').classList.toggle('hidden', aba !== 'regs');
    $('aba-campos').classList.toggle('hidden', aba !== 'campos');
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => trocarAba(b.getAttribute('data-aba'))));
  ['fRegEstado', 'fRegRegulador', 'fRegArea'].forEach(id => $(id).addEventListener('change', renderRegs));
  $('fRegBusca').addEventListener('input', renderRegs);
  ['fCampoRep', 'fCampoCde', 'fCampoOwner', 'fCampoAda'].forEach(id => $(id).addEventListener('change', renderCampos));
  $('fCampoBusca').addEventListener('input', renderCampos);
  $('tbRegs').addEventListener('click', ev => { const tr = ev.target.closest('tr[data-cod]'); if (tr) abrirReg(tr.getAttribute('data-cod')); });
  $('tbCampos').addEventListener('click', ev => { const tr = ev.target.closest('tr[data-id]'); if (tr) abrirCampo(tr.getAttribute('data-id')); });
  $('btnNovoReg').addEventListener('click', () => abrirReg('', true));
  $('btnNovoCampo').addEventListener('click', () => abrirCampo('', true));

  carregar();
</script>
</body>
</html>
