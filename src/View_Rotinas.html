<section id="view-rotinas" class="hidden">
  <div class="panel-box">
    <div class="field" style="flex:2;">
      <label>Título da Nova Rotina Recorrente</label>
      <input type="text" id="rotTitulo" placeholder="Ex: Conferência Semanal de Modelos e Pipelines">
    </div>
    <div class="field">
      <label>Time</label>
      <select id="rotTime"></select>
    </div>
    <div class="field">
      <label>Responsável</label>
      <select id="rotResponsavel"></select>
    </div>
    <div class="field">
      <label>Frequência</label>
      <select id="rotFrequencia">
        <option value="Diária">Diária</option>
        <option value="Semanal" selected>Semanal</option>
        <option value="Mensal">Mensal</option>
      </select>
    </div>
    <div class="field">
      <label>Próxima Data</label>
      <input type="date" id="rotData">
    </div>
    <div class="field" style="flex:2;">
      <label>Itens do Checklist (separados por vírgula)</label>
      <input type="text" id="rotPassos" placeholder="Checar logs, Validar métricas, Enviar resumo">
    </div>
    <button class="btn-primario" onclick="salvarNovaRotinaUI()">+ Criar Rotina</button>
  </div>

  <div id="gridCardsRotinas" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-bottom:18px;"></div>

  <div class="panel-box" style="display:block;">
    <h3 style="margin-top:0;color:var(--primary);">📜 Histórico de Atualizações das Rotinas</h3>
    <table>
      <thead>
        <tr><th>Data/Hora</th><th>Rotina</th><th>Responsável</th><th>Descrição da Atualização</th><th>Checklist</th></tr>
      </thead>
      <tbody id="tbodyHistoricoRotinas"></tbody>
    </table>
  </div>
</section>
