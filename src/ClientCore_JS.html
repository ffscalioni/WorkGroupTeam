<script>
  const STORAGE_KEY = 'WORKSPACE_HUB_V4_CACHE';
  let CARTAO_ARRASTADO_ID = null;
  let OPERACOES_EM_BACKGROUND = 0;

  let STATE = {
    versaoCache: '0',
    usuarioEmail: '',
    membroLogado: null,
    perfilEfetivo: 'TIME',
    cotaEmail: 100,
    agendamentoCache: { ativo: false, intervaloMinutos: 5, ultimoAquecimento: '-' },
    planilhaUrl: '',
    planilhaId: '',
    modoMeuDia: false,
    modoMinhasAtividades: false,
    horizonteRotinas: 'HOJE',
    times: [],
    membros: [],
    objetivos: [],
    projetos: [],
    tarefas: [],
    rotinas: [],
    historicoRotinas: []
  };

  /* ==========================================================================
     PROTEÇÃO CONTRA XSS
     Todo dado vindo da planilha ou digitado por alguém passa por uma destas
     funções antes de entrar em innerHTML. Nunca interpole um campo direto.
     ========================================================================== */

  /** Texto ou valor de atributo HTML: neutraliza < > & " ' */
  function esc(valor) {
    return String(valor === undefined || valor === null ? '' : valor)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /** Valor usado como texto JavaScript dentro de um atributo, ex.: onclick="fn('...')" */
  function escJs(valor) {
    const comoTextoJs = String(valor === undefined || valor === null ? '' : valor)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/[\r\n]/g, ' ')
      .split(String.fromCharCode(8232)).join(' ')  // separador de linha Unicode
      .split(String.fromCharCode(8233)).join(' '); // separador de parágrafo Unicode
    return esc(comoTextoJs);
  }

  /** Cor usada em style="": só aceita hexadecimal, senão usa o azul padrão. */
  function corSegura(valor) {
    return /^#[0-9a-fA-F]{3,8}$/.test(String(valor || '')) ? valor : '#2563eb';
  }

  function gerarIdLocal(prefixo) {
    return `${prefixo}-${Math.floor(1000 + Math.random() * 9000)}`;
  }

  function calcularProximaDataLocal(dataISO, frequencia) {
    const hoje = new Date().toISOString().slice(0, 10);
    const partes = String(dataISO || hoje).split('-');
    const dt = partes.length === 3
      ? new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]))
      : new Date();

    if (frequencia === 'Diária') dt.setDate(dt.getDate() + 1);
    else if (frequencia === 'Semanal') dt.setDate(dt.getDate() + 7);
    else if (frequencia === 'Mensal') dt.setMonth(dt.getMonth() + 1);
    else dt.setDate(dt.getDate() + 1);

    const yyyy = dt.getFullYear();
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function aplicarMutacaoLocalESincronizar(fnMutacaoNoState, fnDisparoBackendAssincrono, descricaoAcao) {
    fnMutacaoNoState();
    STATE.versaoCache = String(new Date().getTime());

    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    popularSelects();
    aplicarPermissoesDePerfilNaTela();
    renderizarInterface();
    atualizarContadorMinhasAtividades();

    OPERACOES_EM_BACKGROUND++;
    atualizarIndicadorSincroniaTopo(`⚡ Salvando (${descricaoAcao})...`, '#f59e0b');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      const runner = google.script.run
        .withSuccessHandler(respostaServidor => {
          OPERACOES_EM_BACKGROUND = Math.max(0, OPERACOES_EM_BACKGROUND - 1);
          if (respostaServidor && respostaServidor.versaoCache) {
            STATE.versaoCache = String(respostaServidor.versaoCache);
            if (respostaServidor.cotaEmail !== undefined) {
              STATE.cotaEmail = respostaServidor.cotaEmail;
              document.getElementById('lblCotaEmail').innerText = '📧 Cota MailApp: ' + STATE.cotaEmail;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
          }
          if (OPERACOES_EM_BACKGROUND === 0) {
            atualizarIndicadorSincroniaTopo(`✅ Sincronizado (Local ➔ Server RAM ➔ Sheets)`, '#38bdf8');
          }
        })
        .withFailureHandler(erro => {
          OPERACOES_EM_BACKGROUND = Math.max(0, OPERACOES_EM_BACKGROUND - 1);
          atualizarIndicadorSincroniaTopo(`⚠️ Erro ao sincronizar: revertendo...`, '#ef4444');
          alert('Não foi possível gravar a alteração no servidor: ' + erro.message);
          sincronizarComServidor();
        });

      fnDisparoBackendAssincrono(runner);
    }
  }

  function atualizarIndicadorSincroniaTopo(texto, corHex) {
    const lbl = document.getElementById('lblVersaoCache');
    if (lbl) {
      lbl.innerText = texto;
      lbl.style.color = corHex || '#38bdf8';
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const hoje = new Date().toISOString().slice(0, 10);
    if (document.getElementById('quickInicio')) document.getElementById('quickInicio').value = hoje;
    if (document.getElementById('quickPrazo')) document.getElementById('quickPrazo').value = hoje;
    if (document.getElementById('rotData')) document.getElementById('rotData').value = hoje;

    const cacheLocal = localStorage.getItem(STORAGE_KEY);
    if (cacheLocal) {
      try {
        STATE = Object.assign(STATE, JSON.parse(cacheLocal));
        popularSelects();
        aplicarPermissoesDePerfilNaTela();
        renderizarInterface();
        atualizarContadorMinhasAtividades();
      } catch (e) {}
    }

    sincronizarComServidor();
    setInterval(verificarAtualizacaoSilenciosa, 30000);

    window.addEventListener('keydown', (ev) => {
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') {
        ev.preventDefault();
        abrirCommandPalette();
      }
    });
  });

  function obterMembroGoogleAtivo() {
    if (STATE.membroLogado && STATE.membroLogado.Nome_Exibicao) {
      return STATE.membroLogado;
    }
    const email = String(STATE.usuarioEmail || '').trim().toLowerCase();
    if (email) {
      const encontrado = STATE.membros.find(m =>
        String(m.Email_Google || '').trim().toLowerCase() === email
      );
      if (encontrado) return encontrado;
    }
    // Sem vínculo confirmado pelo servidor não há membro ativo (nada de "lembrar" o nome no navegador)
    return null;
  }

  /**
   * Perfil REAL do usuário, calculado pelo servidor (STATE.perfilEfetivo).
   * Serve só para montar a tela: a permissão de verdade é validada no servidor.
   */
  function obterPerfilRealDoServidor() {
    const p = String(STATE.perfilEfetivo || 'TIME').toUpperCase();
    return (p === 'ADMIN' || p === 'GESTOR') ? p : 'TIME';
  }

  function obterPerfilAtivoNaTela() {
    const perfilReal = obterPerfilRealDoServidor();
    if (perfilReal === 'TIME') return 'TIME'; // perfil TIME não simula outras visões

    const selVisao = document.getElementById('selSimuladorVisao');
    const valorSimulado = selVisao ? selVisao.value : 'GESTOR';
    if (valorSimulado && valorSimulado !== 'GESTOR') {
      const mSimulado = STATE.membros.find(m => m.Nome_Exibicao === valorSimulado);
      if (mSimulado) {
        const p = String(mSimulado.Perfil_Acesso || 'TIME').toUpperCase();
        return (p === 'ADMIN' || p === 'GESTOR') ? p : 'TIME';
      }
    }
    return perfilReal;
  }

  function aplicarPermissoesDePerfilNaTela() {
    // O simulador de visão só existe para Admin/Gestor (que já recebem todos os dados)
    const caixaSimulador = document.querySelector('.simulador-box');
    const selSimulador = document.getElementById('selSimuladorVisao');
    const podeSimular = obterPerfilRealDoServidor() !== 'TIME';
    if (caixaSimulador) caixaSimulador.classList.toggle('hidden', !podeSimular);
    if (!podeSimular && selSimulador && selSimulador.value !== 'GESTOR') selSimulador.value = 'GESTOR';

    const perfil = obterPerfilAtivoNaTela();
    const btnRelatorios = document.getElementById('tabBtn-relatorios');
    const btnConfig = document.getElementById('tabBtn-config');

    if (btnRelatorios) {
      btnRelatorios.classList.toggle('hidden', perfil === 'TIME');
    }
    if (btnConfig) {
      btnConfig.classList.toggle('hidden', perfil === 'TIME');
      btnConfig.innerText = perfil === 'GESTOR' ? '👥 Gestão de Usuários' : '⚙️ Config & Cache Server';
    }

    const bCache = document.getElementById('blocoAdminCache');
    const bPresets = document.getElementById('blocoAdminPresets');
    const bTimes = document.getElementById('blocoAdminTimes');
    if (bCache) bCache.classList.toggle('hidden', perfil !== 'ADMIN');
    if (bPresets) bPresets.classList.toggle('hidden', perfil !== 'ADMIN');
    if (bTimes) bTimes.classList.toggle('hidden', perfil !== 'ADMIN');

    if (perfil === 'TIME') {
      const naRel = !document.getElementById('view-relatorios').classList.contains('hidden');
      const naCfg = !document.getElementById('view-config').classList.contains('hidden');
      if (naRel || naCfg) navegarPara('kanban');
    }
  }

  function pertenceAoUsuarioGoogleLogado(item) {
    const membro = obterMembroGoogleAtivo();
    const emailLogado = String(STATE.usuarioEmail || '').trim().toLowerCase();
    const resp = String(item.Responsavel || '').trim().toLowerCase();
    const permitidos = String(item.Usuarios_Permitidos || '').toLowerCase();

    if (emailLogado && (resp === emailLogado || permitidos.includes(emailLogado))) {
      return true;
    }
    if (membro) {
      const nome = String(membro.Nome_Exibicao || '').trim().toLowerCase();
      const emailMem = String(membro.Email_Google || '').trim().toLowerCase();
      if (nome && (resp === nome || permitidos.includes(nome))) return true;
      if (emailMem && (resp === emailMem || permitidos.includes(emailMem))) return true;
    }
    return false;
  }

  function usuarioPodeDarCheckNaRotina(rotina) {
    const perfil = obterPerfilAtivoNaTela();
    if (perfil === 'ADMIN' || perfil === 'GESTOR') return true;

    const selVisao = document.getElementById('selSimuladorVisao');
    const valorSimulado = selVisao ? selVisao.value : 'GESTOR';
    if (valorSimulado && valorSimulado !== 'GESTOR') {
      return String(rotina.Responsavel || '').trim() === valorSimulado;
    }

    return pertenceAoUsuarioGoogleLogado(rotina);
  }

  function atualizarContadorMinhasAtividades() {
    const minhasTarefas = STATE.tarefas.filter(t => t.Status !== 'Concluído' && pertenceAoUsuarioGoogleLogado(t));
    const minhasRotinas = STATE.rotinas.filter(r => r.Status_Ciclo !== 'Finalizada' && pertenceAoUsuarioGoogleLogado(r));
    const badgeCount = document.getElementById('badgeMinhasCount');
    if (badgeCount) {
      badgeCount.innerText = `(${minhasTarefas.length + minhasRotinas.length})`;
    }
  }

  function alternarMinhasAtividades() {
    const membro = obterMembroGoogleAtivo();
    if (!membro) {
      vincularMinhaContaGoogleUI(true);
      return;
    }

    STATE.modoMinhasAtividades = !STATE.modoMinhasAtividades;
    const btn = document.getElementById('btnMinhasAtividades');
    if (btn) {
      btn.style.background = STATE.modoMinhasAtividades ? '#2563eb' : '#e0e7ff';
      btn.style.color = STATE.modoMinhasAtividades ? '#ffffff' : '#1d4ed8';
    }
    renderizarInterface();
  }

  function vincularMinhaContaGoogleUI(ativarFiltroDepois) {
    const emailDetectado = STATE.usuarioEmail || 'seu.email@empresa.com';
    const nomesExistentes = STATE.membros.map(m => m.Nome_Exibicao).join(', ');
    const nomeEscolhido = prompt(
      `🔗 VINCULAR CONTA GOOGLE (${emailDetectado})\n\n` +
      `Digite seu Nome de Exibição exatamente como está na equipe (ou digite seu nome para criar seu cadastro agora):\n` +
      `Membros atuais: ${nomesExistentes}`,
      STATE.membroLogado ? STATE.membroLogado.Nome_Exibicao : ''
    );

    if (!nomeEscolhido || !nomeEscolhido.trim()) return;

    const timePadrao = STATE.times[0] ? STATE.times[0].ID_Time : 'TM-DATA';
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          if (ativarFiltroDepois) STATE.modoMinhasAtividades = true;
          salvarCacheNavegador(res);
          alert(`✅ Conta Google (${res.usuarioEmail || emailDetectado}) vinculada com sucesso a "${nomeEscolhido.trim()}"!`);
        })
        .withFailureHandler(err => {
          alert('Não foi possível vincular sua conta: ' + err.message);
        })
        .apiVincularMeuEmailGoogle(nomeEscolhido.trim(), timePadrao);
    }
  }

  function salvarCacheNavegador(novoEstado) {
    STATE = Object.assign(STATE, novoEstado);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));

    atualizarIndicadorSincroniaTopo('🟢 RAM v' + STATE.versaoCache, '#38bdf8');

    const membroAtivo = obterMembroGoogleAtivo();
    const textoIdentificacao = membroAtivo
      ? `🟢 Conta Google: ${STATE.usuarioEmail || membroAtivo.Email_Google} ➔ ${membroAtivo.Nome_Exibicao} [Perfil: ${membroAtivo.Perfil_Acesso}]`
      : `🟡 Conta Google: ${STATE.usuarioEmail || 'Não vinculado'} (Clique em "🔗 Vincular Meu E-mail Google")`;
    document.getElementById('lblUsuarioAtivo').innerText = textoIdentificacao;
    document.getElementById('lblCotaEmail').innerText = '📧 Cota MailApp: ' + STATE.cotaEmail;

    atualizarContadorMinhasAtividades();

    const ag = STATE.agendamentoCache || { ativo: false, intervaloMinutos: 5, ultimoAquecimento: '-' };
    const lblAg = document.getElementById('lblStatusAgendamento');
    if (lblAg) {
      lblAg.innerText = ag.ativo
        ? `⏰ Cache Server: Ativo (${ag.intervaloMinutos} min)`
        : '⚠️ Cache Server: Clique em Configurar p/ Agendar 5 min';
    }
    const badgeTrig = document.getElementById('badgeStatusTrigger');
    if (badgeTrig) {
      badgeTrig.innerText = ag.ativo ? `🟢 Ativo no Google (a cada ${ag.intervaloMinutos} min)` : '🔴 Ainda não agendado';
    }
    if (document.getElementById('txtUltimoWarmup')) {
      document.getElementById('txtUltimoWarmup').value = ag.ultimoAquecimento || '-';
    }
    if (document.getElementById('selIntervaloCache') && ag.intervaloMinutos) {
      document.getElementById('selIntervaloCache').value = String(ag.intervaloMinutos);
    }

    const btnPlanilha = document.getElementById('linkPlanilhaBase');
    if (btnPlanilha && STATE.planilhaUrl) {
      btnPlanilha.href = STATE.planilhaUrl;
    }

    popularSelects();
    aplicarPermissoesDePerfilNaTela();
    renderizarInterface();
  }

  function sincronizarComServidor() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(salvarCacheNavegador).apiObterEstadoCompleto();
    }
  }

  function verificarAtualizacaoSilenciosa() {
    if (OPERACOES_EM_BACKGROUND > 0) return;
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(res => {
        if (res && String(res.versaoCache) !== String(STATE.versaoCache) && OPERACOES_EM_BACKGROUND === 0) {
          sincronizarComServidor();
        }
      }).apiVerificarVersaoCache();
    }
  }

  function forcarSincroniaServidor() {
    atualizarIndicadorSincroniaTopo('🔄 Recarregando Sheets ➔ RAM...', '#f59e0b');
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(salvarCacheNavegador)
        .withFailureHandler(err => {
          atualizarIndicadorSincroniaTopo('⚠️ Sincronização recusada', '#ef4444');
          alert(err.message);
        })
        .apiForcarRecargaCache();
    }
  }

  function salvarAgendamentoCacheUI() {
    const min = Number(document.getElementById('selIntervaloCache').value || 5);
    const badge = document.getElementById('badgeStatusTrigger');
    if (badge) badge.innerText = '⏳ Registrando gatilho de ' + min + ' min no Google...';
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          salvarCacheNavegador(res);
          alert(`✅ Agendamento ativado! O servidor do Google agora carrega o JSON paginado no CacheService a cada ${min} minutos.`);
        })
        .withFailureHandler(err => alert('Erro ao agendar: ' + err.message))
        .apiConfigurarAgendamentoCache(min);
    }
  }

  function aplicarPresetUI(codigoPreset) {
    if (!confirm('Deseja adicionar os dados de exemplo deste Preset na sua planilha e nos dois caches?')) return;
    atualizarIndicadorSincroniaTopo('⚡ Aplicando Preset...', '#f59e0b');
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          salvarCacheNavegador(res);
          alert('✅ Preset adicionado com sucesso!');
        })
        .withFailureHandler(err => {
          atualizarIndicadorSincroniaTopo('⚠️ Preset não aplicado', '#ef4444');
          alert('Não foi possível aplicar o preset: ' + err.message);
        })
        .apiAplicarPresetArea(codigoPreset);
    }
  }

  function gerarFormulaGeminiPlanilhaUI() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          alert(`✨ ${res.mensagem}\nClique em "📊 Abrir Planilha Base" no topo para ver a aba IA_Gemini_Workspace!`);
        })
        .withFailureHandler(err => alert('Não foi possível gerar o resumo: ' + err.message))
        .apiInserirFormulaGeminiPlanilha();
    }
  }

  function navegarPara(aba) {
    ['kanban', 'rotinas', 'hierarquia', 'relatorios', 'config'].forEach(id => {
      document.getElementById('view-' + id).classList.toggle('hidden', id !== aba);
      document.getElementById('tabBtn-' + id).classList.toggle('active', id === aba);
    });
  }

  function alternarModoMeuDia() {
    STATE.modoMeuDia = !STATE.modoMeuDia;
    document.getElementById('btnMeuDia').classList.toggle('ativo', STATE.modoMeuDia);
    renderizarInterface();
  }

  function itemVisivelParaSimulador(item) {
    const visao = document.getElementById('selSimuladorVisao') ? document.getElementById('selSimuladorVisao').value : 'GESTOR';
    if (!visao || visao === 'GESTOR') return true;
    const membro = STATE.membros.find(m => m.Nome_Exibicao === visao);
    if (!membro || membro.Perfil_Acesso === 'ADMIN' || membro.Perfil_Acesso === 'GESTOR') return true;

    const tipoVis = item.Tipo_Visibilidade || 'PUBLICO';
    if (tipoVis === 'PUBLICO') return true;
    if (tipoVis === 'TIME') return item.ID_Time === membro.ID_Time_Principal;
    if (tipoVis === 'RESTRITO') {
      const permitidos = String(item.Usuarios_Permitidos || '');
      return permitidos.includes(membro.Nome_Exibicao) ||
             permitidos.includes(membro.Email_Google) ||
             item.Responsavel === membro.Nome_Exibicao ||
             item.Lider === membro.Nome_Exibicao;
    }
    return true;
  }

  function popularSelects() {
    const fTime = document.getElementById('filtroTimeKanban');
    const fObj = document.getElementById('filtroObjetivoKanban');
    const fPrj = document.getElementById('filtroProjetoKanban');
    const selVisao = document.getElementById('selSimuladorVisao');
    if (!fTime) return;

    const valTime = fTime.value || 'TODOS';
    const valObj = fObj.value || 'TODOS';
    const valPrj = fPrj ? (fPrj.value || 'TODOS') : 'TODOS';
    const valVisao = selVisao ? (selVisao.value || 'GESTOR') : 'GESTOR';

    fTime.innerHTML = '<option value="TODOS">Todas as Áreas / Times</option>' +
      STATE.times.map(t => `<option value="${esc(t.ID_Time)}">${esc(t.Sigla)} — ${esc(t.Nome_Time)}</option>`).join('');
    fObj.innerHTML = '<option value="TODOS">Todos os Objetivos</option>' +
      STATE.objetivos.map(o => `<option value="${esc(o.ID_Objetivo)}">${esc(o.Titulo_Objetivo)}</option>`).join('');
    if (fPrj) {
      fPrj.innerHTML = '<option value="TODOS">Todos os Projetos</option>' +
        STATE.projetos.map(p => `<option value="${esc(p.ID_Projeto)}">${esc(p.Nome_Projeto)}</option>`).join('');
    }
    if (selVisao) {
      selVisao.innerHTML = '<option value="GESTOR">👑 Simular Admin/Gestor (Vê Tudo)</option>' +
        STATE.membros.map(m => `<option value="${esc(m.Nome_Exibicao)}">👤 ${esc(m.Nome_Exibicao)} [Perfil: ${esc(m.Perfil_Acesso)}]</option>`).join('');
    }

    fTime.value = valTime;
    fObj.value = valObj;
    if (fPrj) fPrj.value = valPrj;
    if (selVisao) selVisao.value = valVisao;

    const optsTime = STATE.times.map(t => `<option value="${esc(t.ID_Time)}">${esc(t.Sigla)} — ${esc(t.Nome_Time)}</option>`).join('');
    const optsMembros = STATE.membros.map(m => `<option value="${esc(m.Nome_Exibicao)}">${esc(m.Nome_Exibicao)}</option>`).join('');
    const optsProj = '<option value="">Sem projeto específico</option>' +
      STATE.projetos.map(p => `<option value="${esc(p.ID_Projeto)}">${esc(p.Nome_Projeto)}</option>`).join('');
    const optsObj = '<option value="">Selecione um Objetivo...</option>' +
      STATE.objetivos.map(o => `<option value="${esc(o.ID_Objetivo)}">${esc(o.Titulo_Objetivo)}</option>`).join('');
    const optsDep = '<option value="">Sem dependência</option>' +
      STATE.tarefas.map(t => `<option value="${esc(t.ID_Tarefa)}">[${esc(t.ID_Tarefa)}] ${esc(t.Titulo_Tarefa)}</option>`).join('');

    if (document.getElementById('quickObjetivo')) document.getElementById('quickObjetivo').innerHTML = optsObj;
    if (document.getElementById('quickProjeto')) document.getElementById('quickProjeto').innerHTML = optsProj;
    if (document.getElementById('quickResponsavel')) document.getElementById('quickResponsavel').innerHTML = optsMembros;
    if (document.getElementById('quickDependencia')) document.getElementById('quickDependencia').innerHTML = optsDep;

    const meuMembro = obterMembroGoogleAtivo();
    if (meuMembro && document.getElementById('quickResponsavel')) {
      document.getElementById('quickResponsavel').value = meuMembro.Nome_Exibicao;
    }

    if (document.getElementById('rotTime')) document.getElementById('rotTime').innerHTML = optsTime;
    if (document.getElementById('rotResponsavel')) document.getElementById('rotResponsavel').innerHTML = optsMembros;
    if (document.getElementById('novoObjTime')) document.getElementById('novoObjTime').innerHTML = optsTime;
    if (document.getElementById('novoPrjObj')) document.getElementById('novoPrjObj').innerHTML = optsObj;
    if (document.getElementById('novoPrjLider')) document.getElementById('novoPrjLider').innerHTML = optsMembros;
    if (document.getElementById('cfgMemTime')) document.getElementById('cfgMemTime').innerHTML = optsTime;
    if (document.getElementById('modObjetivoTarefa')) document.getElementById('modObjetivoTarefa').innerHTML = optsObj;
    if (document.getElementById('modProjetoTarefa')) document.getElementById('modProjetoTarefa').innerHTML = optsProj;
    if (document.getElementById('modRespTarefa')) document.getElementById('modRespTarefa').innerHTML = optsMembros;

  function renderizarKanban() {
    const cols = ['A Fazer', 'Em Andamento', 'Bloqueado', 'Concluído'];
    const iconeCol = { 'A Fazer': '📌', 'Em Andamento': '⚡', 'Bloqueado': '🚨', 'Concluído': '✅' };
    const cont = document.getElementById('containerColunasKanban');
    if (!cont) return;
    cont.innerHTML = '';

    const fTime = document.getElementById('filtroTimeKanban').value || 'TODOS';
    const fObj = document.getElementById('filtroObjetivoKanban').value || 'TODOS';
    const fPrj = document.getElementById('filtroProjetoKanban') ? document.getElementById('filtroProjetoKanban').value : 'TODOS';
    const fAg = document.getElementById('filtroAgendamentoKanban').value || 'TODAS';
    const hoje = new Date().toISOString().slice(0, 10);

    cols.forEach((status, idxCol) => {
      const tarefasCol = STATE.tarefas.filter(t => {
        if (!itemVisivelParaSimulador(t)) return false;
        if (STATE.modoMinhasAtividades && !pertenceAoUsuarioGoogleLogado(t)) return false;
        if (t.Status !== status) return false;
        if (fTime !== 'TODOS' && t.ID_Time !== fTime) return false;
        if (fObj !== 'TODOS' && t.ID_Objetivo !== fObj) return false;
        if (fPrj !== 'TODOS' && t.ID_Projeto !== fPrj) return false;
        if (STATE.modoMeuDia && t.Data_Inicio > hoje) return false;
        if (fAg === 'HOJE' && t.Data_Inicio > hoje) return false;
        if (fAg === 'FUTURAS' && (!t.Data_Inicio || t.Data_Inicio <= hoje)) return false;
        if (fAg === 'DEPENDENCIA' && !t.ID_Tarefa_Predecessora) return false;
        return true;
      });

      const divCol = document.createElement('div');
      divCol.className = 'kanban-col';
      divCol.setAttribute('ondragover', 'permitirSoltarCartao(event, this)');
      divCol.setAttribute('ondragleave', 'sairArrasteColuna(this)');
      divCol.setAttribute('ondrop', `soltarCartaoNaColuna(event, '${status}', this)`);

      divCol.innerHTML = `
        <div class="kanban-col-header">
          <span>${iconeCol[status] || ''} ${status}</span>
          <span class="col-count">${tarefasCol.length}</span>
        </div>
        <div class="kanban-dropzone"></div>
      `;
      const dropzone = divCol.querySelector('.kanban-dropzone');

      tarefasCol.forEach(t => {
        const timeObj = STATE.times.find(tm => tm.ID_Time === t.ID_Time) || { Sigla: 'ÁREA', Cor_Hex: '#2563eb' };
        const objEstrategico = STATE.objetivos.find(o => o.ID_Objetivo === t.ID_Objetivo);
        const projObj = STATE.projetos.find(p => p.ID_Projeto === t.ID_Projeto);
        const ehFutura = t.Data_Inicio && t.Data_Inicio > hoje;
        const qtdDependentes = STATE.tarefas.filter(d => String(d.ID_Tarefa_Predecessora) === String(t.ID_Tarefa) && d.Status !== 'Concluído').length;

        let htmlDep = '';
        if (t.ID_Tarefa_Predecessora) {
          const pred = STATE.tarefas.find(p => String(p.ID_Tarefa) === String(t.ID_Tarefa_Predecessora));
          const liberada = pred && pred.Status === 'Concluído';
          htmlDep = `<div class="${liberada ? 'dep-ok' : 'dep-alert'}">${liberada ? '🔓 Liberada por:' : '🔒 Aguardando:'} [${esc(t.ID_Tarefa_Predecessora)}] ${esc(pred ? pred.Titulo_Tarefa : '')}</div>`;
        }

        const statusAnterior = idxCol > 0 ? cols[idxCol - 1] : null;
        const statusProximo = idxCol < cols.length - 1 ? cols[idxCol + 1] : null;

        const card = document.createElement('div');
        card.className = `card-task prio-${t.Prioridade || 'Média'}`;
        card.setAttribute('draggable', 'true');
        card.addEventListener('dragstart', ev => iniciarArrasteCartao(ev, t.ID_Tarefa));

        card.innerHTML = `
          <div class="card-top-badges">
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              <span class="badge" style="background:${corSegura(timeObj.Cor_Hex)};color:#fff;">${esc(timeObj.Sigla)}</span>
              ${objEstrategico ? `<span class="badge" style="background:#dbeafe;color:#1e40af;">🎯 ${esc(objEstrategico.Titulo_Objetivo)}</span>` : ''}
              ${projObj ? `<span class="badge badge-project">📁 ${esc(projObj.Nome_Projeto)}</span>` : ''}
              ${ehFutura ? `<span class="badge badge-future">🗓️ ${esc(t.Data_Inicio)}</span>` : ''}
              ${qtdDependentes > 0 ? `<span class="badge badge-bottleneck">🔥 Destrava ${qtdDependentes}</span>` : ''}
            </div>
            <button class="btn-arrow" title="Editar ou Excluir Tarefa" onclick="abrirModalEditarTarefa('${escJs(t.ID_Tarefa)}')">✏️</button>
          </div>
          <div class="task-title">[${esc(t.ID_Tarefa)}] ${esc(t.Titulo_Tarefa)}</div>
          ${htmlDep}
          <div class="task-meta">
            👤 <strong>${esc(t.Responsavel)}</strong> · 📅 Prazo: ${esc(t.Data_Prazo || '-')}<br>
            👁️ ${esc(t.Tipo_Visibilidade || 'PUBLICO')}
          </div>
          <div class="card-actions">
            ${statusAnterior ? `<button class="btn-arrow" title="Voltar para ${statusAnterior}" onclick="mudarStatusTarefaUI('${escJs(t.ID_Tarefa)}', '${statusAnterior}')">◀</button>` : ''}
            <select class="status-select-card" onchange="mudarStatusTarefaUI('${escJs(t.ID_Tarefa)}', this.value)">
              ${cols.map(c => `<option value="${c}" ${t.Status === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
            ${statusProximo ? `<button class="btn-arrow" title="Avançar para ${statusProximo}" onclick="mudarStatusTarefaUI('${escJs(t.ID_Tarefa)}', '${statusProximo}')">▶</button>` : ''}
          </div>
        `;
        dropzone.appendChild(card);
      });

      cont.appendChild(divCol);
    });
  }

  function formatarCabecalhoDiaSemana(dataISO) {
    if (!dataISO) return 'Sem Data Definida';
    const partes = dataISO.split('-');
    if (partes.length !== 3) return dataISO;
    const dt = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
    const nomesDias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    return `📅 ${nomesDias[dt.getDay()]} — ${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function obterGrupoSemanaDoMes(dataISO) {
    if (!dataISO) return 'Sem Data Definida';
    const partes = dataISO.split('-');
    if (partes.length !== 3) return dataISO;
    const dia = Number(partes[2]);
    const numSemana = Math.ceil(dia / 7);
    const inicioFaixa = (numSemana - 1) * 7 + 1;
    const fimFaixa = Math.min(31, numSemana * 7);
    return `📆 Semana ${numSemana} do Mês (Dias ${String(inicioFaixa).padStart(2, '0')} a ${String(fimFaixa).padStart(2, '0')}/${partes[1]})`;
  }

  function renderizarRotinas() {
    const cont = document.getElementById('containerListaRotinasAgrupadas');
    if (!cont) return;
    cont.innerHTML = '';

    const hoje = new Date().toISOString().slice(0, 10);
    const dtHoje = new Date(hoje + 'T00:00:00');
    const dtFimSemana = new Date(dtHoje);
    dtFimSemana.setDate(dtFimSemana.getDate() + 7);
    const fimSemanaISO = dtFimSemana.toISOString().slice(0, 10);
    const mesAtualPrefix = hoje.slice(0, 7);

    const rotinasFiltradas = STATE.rotinas
      .filter(itemVisivelParaSimulador)
      .filter(r => !STATE.modoMinhasAtividades || pertenceAoUsuarioGoogleLogado(r))
      .filter(r => {
        const dt = r.Proxima_Execucao || hoje;
        if (STATE.horizonteRotinas === 'HOJE') return dt <= hoje;
        if (STATE.horizonteRotinas === 'SEMANA') return dt >= hoje && dt <= fimSemanaISO;
        if (STATE.horizonteRotinas === 'MES') return dt.startsWith(mesAtualPrefix);
        return true;
      })
      .sort((a, b) => String(a.Proxima_Execucao || '').localeCompare(String(b.Proxima_Execucao || '')));

    if (rotinasFiltradas.length === 0) {
      cont.innerHTML = `
        <div class="panel-box" style="justify-content:center;padding:28px;color:var(--muted);">
          🎉 Nenhuma rotina programada para este filtro (${STATE.horizonteRotinas}). Use os botões acima para ver da Semana ou do Mês!
        </div>
      `;
    } else {
      const grupos = {};
      rotinasFiltradas.forEach(r => {
        let chaveGrupo = '⚡ Rotinas de Hoje & Pendentes';
        if (STATE.horizonteRotinas === 'SEMANA' || STATE.horizonteRotinas === 'TODAS') {
          chaveGrupo = formatarCabecalhoDiaSemana(r.Proxima_Execucao);
        } else if (STATE.horizonteRotinas === 'MES') {
          chaveGrupo = obterGrupoSemanaDoMes(r.Proxima_Execucao);
        }
        if (!grupos[chaveGrupo]) grupos[chaveGrupo] = [];
        grupos[chaveGrupo].push(r);
      });

      Object.keys(grupos).forEach(nomeGrupo => {
        const boxGrupo = document.createElement('div');
        boxGrupo.className = 'panel-box';
        boxGrupo.style.display = 'block';
        boxGrupo.innerHTML = `
          <div style="font-weight:800;font-size:13.5px;color:var(--primary);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px;">
            ${esc(nomeGrupo)} (${grupos[nomeGrupo].length})
          </div>
          <div class="lista-linhas-rotinas"></div>
        `;
        const listaContainer = boxGrupo.querySelector('.lista-linhas-rotinas');

        grupos[nomeGrupo].forEach(r => {
          const timeObj = STATE.times.find(tm => tm.ID_Time === r.ID_Time) || { Sigla: 'ÁREA', Cor_Hex: '#2563eb' };
          const podeOperar = usuarioPodeDarCheckNaRotina(r);
          const st = r.Status_Ciclo || 'Pendente';

          let textoBotao = '⬜ 1º Clique: Dar Check';
          let corBotao = '#2563eb';
          if (st === 'Check') {
            textoBotao = '☑️ Check OK! (2º Clique: Finalizar ✅)';
            corBotao = '#d97706';
          } else if (st === 'Finalizada') {
            textoBotao = '✅ Finalizada';
            corBotao = '#16a34a';
          }

          const detalhesHover = `📋 DETALHES DA ROTINA [${r.ID_Rotina}]\n` +
            `• Orientações: ${r.Checklist_Amigavel || 'Sem detalhes adicionais'}\n` +
            `• Frequência: ${r.Frequencia} | Data: ${r.Proxima_Execucao}\n` +
            `• Responsável: ${r.Responsavel}\n` +

  function salvarObsRapidaUI(idRotina, textoObs) {
    const r = STATE.rotinas.find(x => x.ID_Rotina === idRotina);
    if (!r) return;
    aplicarMutacaoLocalESincronizar(

    );

  function clicarBotaoRotinaUI(idRotina) {
    const r = STATE.rotinas.find(x => x.ID_Rotina === idRotina);
    if (!r) return;
    if (!usuarioPodeDarCheckNaRotina(r)) {
      return alert('🔒 Apenas o próprio responsável pela rotina, um Gestor ou Admin pode dar check ou finalizar!');
    }

    const inputObs = document.getElementById('obsRapida-' + idRotina);
    const obsTexto = inputObs && inputObs.value.trim() !== ''
      ? inputObs.value.trim()
      : (r.Ultima_Descricao || 'Verificado sem observações.');
    const membroAtivo = obterMembroGoogleAtivo();
    const quemClicou = membroAtivo ? membroAtivo.Nome_Exibicao : (STATE.usuarioEmail || 'Gestor');
    const agoraStr = new Date().toISOString().slice(0, 16).replace('T', ' ');
    const idLogNovo = gerarIdLocal('LOG');

    const eraCheck = (r.Status_Ciclo === 'Check');
    const proxData = (!eraCheck || r.Frequencia === 'Pontual')
      ? r.Proxima_Execucao
      : calcularProximaDataLocal(r.Proxima_Execucao, r.Frequencia);

    const payload = {
      idRotina,
      observacaoRapida: obsTexto,
      usuarioAcao: quemClicou,
      dataHora: agoraStr,
      idLog: idLogNovo,
      novoStatus: eraCheck ? 'Finalizada' : 'Check',
      proximaData: proxData
    };

    aplicarMutacaoLocalESincronizar(
      () => {
        if (!eraCheck) {
          r.Status_Ciclo = 'Check';
          r.Ultima_Descricao = obsTexto;
          r.Ultima_Execucao = agoraStr;
        } else {
          STATE.historicoRotinas.unshift({
            ID_Log: idLogNovo,
            ID_Rotina: r.ID_Rotina,
            Titulo_Rotina: r.Titulo_Rotina,
            Responsavel: `${r.Responsavel} (por ${quemClicou})`,
            Data_Hora_Registro: agoraStr,
            Descricao_Informada: obsTexto,
            Resumo_Checklist: `Finalizada (${r.Frequencia})`
          });
          if (r.Frequencia === 'Pontual') {
            r.Status_Ciclo = 'Finalizada';
            r.Ultima_Descricao = obsTexto;
            r.Ultima_Execucao = agoraStr;
          } else {
            r.Status_Ciclo = 'Pendente';
            r.Proxima_Execucao = proxData;
            r.Ultima_Descricao = `[Concluída em ${agoraStr}] ${obsTexto}`;
            r.Ultima_Execucao = agoraStr;
          }
        }
      },
      runner => runner.apiAvancarCliqueRotina(payload),
      eraCheck ? 'Finalizar ' + idRotina : 'Check ' + idRotina
    );
  }

  function renderizarRelatorios() {
    const hoje = new Date().toISOString().slice(0, 10);
    const totalTarefas = STATE.tarefas.length;
    const concluidas = STATE.tarefas.filter(t => t.Status === 'Concluído').length;
    const pctGeral = totalTarefas ? Math.round((concluidas / totalTarefas) * 100) : 0;
    const comDepBloq = STATE.tarefas.filter(t => {
      if (!t.ID_Tarefa_Predecessora || t.Status === 'Concluído') return false;
      const pred = STATE.tarefas.find(p => p.ID_Tarefa === t.ID_Tarefa_Predecessora);
      return pred && pred.Status !== 'Concluído';
    }).length;
    const futuras = STATE.tarefas.filter(t => t.Data_Inicio && t.Data_Inicio > hoje).length;
    const rotinasCheck = STATE.rotinas.filter(r => r.Status_Ciclo === 'Check' || r.Status_Ciclo === 'Finalizada').length;

    const kpiGrid = document.getElementById('gridKpisRelatorio');
    if (kpiGrid) {
      kpiGrid.innerHTML = `
        <div class="kpi-card"><div class="kpi-label">Taxa de Entrega Geral</div><div class="kpi-value" style="color:var(--primary);">${pctGeral}%</div><div class="kpi-sub">${concluidas} de ${totalTarefas} tarefas concluídas</div></div>
        <div class="kpi-card"><div class="kpi-label">Rotinas c/ Check ou Finalizadas</div><div class="kpi-value" style="color:var(--success);">${rotinasCheck}/${STATE.rotinas.length}</div><div class="kpi-sub">${STATE.historicoRotinas.length} execuções no histórico</div></div>
        <div class="kpi-card"><div class="kpi-label">Aguardando Dependência</div><div class="kpi-value" style="color:var(--danger);">${comDepBloq}</div><div class="kpi-sub">Tarefas travadas por predecessoras</div></div>
        <div class="kpi-card"><div class="kpi-label">Agendadas p/ Data Futura</div><div class="kpi-value" style="color:var(--purple);">${futuras}</div><div class="kpi-sub">Atividades planejadas adiante</div></div>
      `;
    }

    const tbRot = document.getElementById('tbodyRelRotinas');
    if (tbRot) {
      tbRot.innerHTML = STATE.rotinas.map(r => `
        <tr>
          <td><strong>[${esc(r.ID_Rotina)}] ${esc(r.Titulo_Rotina)}</strong></td>
          <td>${esc(r.Frequencia)} (Data: ${esc(r.Proxima_Execucao)})</td>

          <td><span class="badge" style="background:${r.Status_Ciclo === 'Pendente' ? '#fef3c7' : '#dcfce7'};">${esc(r.Status_Ciclo)}</span></td>
          <td>${esc(r.Ultima_Descricao || '-')}</td>

    const tbObj = document.getElementById('tbodyRelObjetivos');
    if (tbObj) {
      tbObj.innerHTML = STATE.objetivos.map(o => {
        const t = STATE.tarefas.filter(x => x.ID_Objetivo === o.ID_Objetivo);
        const feitas = t.filter(x => x.Status === 'Concluído').length;
        const pct = t.length ? Math.round((feitas / t.length) * 100) : 0;
        return `<tr><td><strong>${esc(o.Titulo_Objetivo)}</strong></td><td>${esc(o.Meta_Indicador)}</td><td>${feitas}/${t.length}</td><td><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><strong>${pct}%</strong></td></tr>`;

        const t = STATE.tarefas.filter(x => x.ID_Projeto === p.ID_Projeto);

    const tbInd = document.getElementById('tbodyRelIndividuos');
    if (tbInd) {
      tbInd.innerHTML = STATE.membros.map(m => {
        const t = STATE.tarefas.filter(x => x.Responsavel === m.Nome_Exibicao);
        const feitas = t.filter(x => x.Status === 'Concluído').length;
        const rots = STATE.rotinas.filter(r => r.Responsavel === m.Nome_Exibicao).length;
        const pct = t.length ? Math.round((feitas / t.length) * 100) : 0;
        return `<tr><td><strong>${esc(m.Nome_Exibicao)}</strong><br><small style="color:var(--muted);">${esc(m.Email_Google || '')}</small></td><td>${esc(m.ID_Time_Principal)}</td><td>${t.length - feitas} abertas</td><td>${rots} rotinas</td><td><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><strong>${pct}%</strong> (${feitas}/${t.length})</td></tr>`;
      }).join('');
    }
  }

  function renderizarConfig() {
    const tbTimes = document.getElementById('tbodyTimesConfig');
    if (tbTimes) {
      tbTimes.innerHTML = STATE.times.map(t => `
        <tr>
          <td><span class="badge" style="background:${corSegura(t.Cor_Hex)};color:#fff;padding:5px 10px;">${esc(t.Sigla)}</span></td>
          <td><strong>${esc(t.Nome_Time)}</strong> <small style="color:var(--muted);">(${esc(t.ID_Time)})</small></td>
          <td>
            <button class="btn-arrow" title="Editar Área" onclick="prepararEdicaoTime('${escJs(t.ID_Time)}')">✏️ Editar</button>
            <button class="btn-arrow" style="color:#dc2626;" title="Excluir Área" onclick="excluirTimeUI('${escJs(t.ID_Time)}')">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    const tbMem = document.getElementById('tbodyMembrosConfig');
    if (tbMem) {
      tbMem.innerHTML = STATE.membros.map(m => {
        const tm = STATE.times.find(t => t.ID_Time === m.ID_Time_Principal);
        return `
          <tr>
            <td><strong>${esc(m.Nome_Exibicao)}</strong></td>
            <td>${esc(m.Email_Google || '-')}</td>
            <td>${esc(tm ? tm.Sigla : m.ID_Time_Principal)}</td>
            <td><span class="badge" style="background:#e0e7ff;color:#1d4ed8;">${esc(m.Perfil_Acesso)}</span></td>
            <td>
              <button class="btn-arrow" title="Editar Usuário" onclick="prepararEdicaoMembro('${escJs(m.ID_Membro)}')">✏️ Editar</button>
              <button class="btn-arrow" style="color:#dc2626;" title="Excluir Usuário" onclick="excluirMembroUI('${escJs(m.ID_Membro)}')">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }
  }

  function prepararEdicaoTime(idTime) {
    const t = STATE.times.find(x => x.ID_Time === idTime);
    if (!t) return;
    document.getElementById('tituloFormTime').innerText = `✏️ Editando Área [${t.ID_Time}]`;
    document.getElementById('cfgTimeIdEdicao').value = t.ID_Time;
    document.getElementById('cfgTimeNome').value = t.Nome_Time || '';
    document.getElementById('cfgTimeSigla').value = t.Sigla || '';
    document.getElementById('cfgTimeCor').value = t.Cor_Hex || '#2563eb';
    document.getElementById('btnCancelarEdicaoTime').classList.remove('hidden');
  }

  function limparFormTime() {
    document.getElementById('tituloFormTime').innerText = '🏢 Cadastrar / Editar Área (Time)';
    document.getElementById('cfgTimeIdEdicao').value = '';
    document.getElementById('cfgTimeNome').value = '';
    document.getElementById('cfgTimeSigla').value = '';
    document.getElementById('btnCancelarEdicaoTime').classList.add('hidden');
  }

  function criarOuEditarTimeUI() {
    const idEdicao = document.getElementById('cfgTimeIdEdicao').value.trim();
    const nome = document.getElementById('cfgTimeNome').value.trim();
    const sigla = document.getElementById('cfgTimeSigla').value.trim();
    const cor = document.getElementById('cfgTimeCor').value;
    if (!nome || !sigla) return alert('Preencha nome e sigla da Área/Time!');
    limparFormTime();
    const idGerado = idEdicao || gerarIdLocal('TM');

    aplicarMutacaoLocalESincronizar(
      () => {
        if (idEdicao) {
          const item = STATE.times.find(t => t.ID_Time === idEdicao);
          if (item) { item.Nome_Time = nome; item.Sigla = sigla; item.Cor_Hex = cor; }
        } else {
          STATE.times.push({ ID_Time: idGerado, Nome_Time: nome, Sigla: sigla, Cor_Hex: cor, Ativo: 'SIM' });
        }
      },
      runner => runner.apiCriarItemEstrutura('TIME', { idTimeEdicao: idEdicao, idGerado, nome, sigla, cor }),
      'Salvar Área'
    );
  }

  function excluirTimeUI(idTime) {
    if (!confirm(`Deseja realmente excluir a área [${idTime}]?`)) return;
    aplicarMutacaoLocalESincronizar(
      () => { STATE.times = STATE.times.filter(t => t.ID_Time !== idTime); },
      runner => runner.apiExcluirItem('TIME', idTime),
      'Excluir Área'
    );
  }

  function prepararEdicaoMembro(idMembro) {
    const m = STATE.membros.find(x => x.ID_Membro === idMembro);
    if (!m) return;
    document.getElementById('tituloFormMembro').innerText = `✏️ Editando Usuário [${m.Nome_Exibicao}]`;
    document.getElementById('cfgMemIdEdicao').value = m.ID_Membro;
    document.getElementById('cfgMemNome').value = m.Nome_Exibicao || '';
    document.getElementById('cfgMemEmail').value = m.Email_Google || '';
    document.getElementById('cfgMemTime').value = m.ID_Time_Principal || '';
    document.getElementById('cfgMemPerfil').value = (m.Perfil_Acesso === 'MEMBRO' ? 'TIME' : m.Perfil_Acesso) || 'TIME';
    document.getElementById('btnCancelarEdicaoMembro').classList.remove('hidden');
  }

  function limparFormMembro() {
    document.getElementById('tituloFormMembro').innerText = '👤 Cadastrar / Editar Usuário (Conta Google & Perfil)';
    document.getElementById('cfgMemIdEdicao').value = '';
    document.getElementById('cfgMemNome').value = '';
    document.getElementById('cfgMemEmail').value = '';
    document.getElementById('btnCancelarEdicaoMembro').classList.add('hidden');
  }

  function criarOuEditarMembroUI() {
    const idEdicao = document.getElementById('cfgMemIdEdicao').value.trim();
    const nome = document.getElementById('cfgMemNome').value.trim();
    const email = document.getElementById('cfgMemEmail').value.trim().toLowerCase();
    const idTime = document.getElementById('cfgMemTime').value;
    const perfil = document.getElementById('cfgMemPerfil').value;
    if (!nome || !email) return alert('Informe o Nome de Exibição e o E-mail Google da pessoa!');
    limparFormMembro();
    const idGerado = idEdicao || gerarIdLocal('MEM');

    aplicarMutacaoLocalESincronizar(
      () => {
        if (idEdicao) {
          const item = STATE.membros.find(m => m.ID_Membro === idEdicao);
          if (item) {
            item.Nome_Exibicao = nome;
            item.Email_Google = email;
            item.ID_Time_Principal = idTime;
            item.Perfil_Acesso = perfil;
          }
        } else {
          STATE.membros.push({ ID_Membro: idGerado, Nome_Exibicao: nome, Email_Google: email, ID_Time_Principal: idTime, Perfil_Acesso: perfil });
        }
      },
      runner => runner.apiCriarItemEstrutura('MEMBRO', { idMembroEdicao: idEdicao, idGerado, nome, email, idTime, perfil }),
      'Salvar Usuário'
    );
  }

  function excluirMembroUI(idMembro) {
    if (!confirm(`Deseja realmente excluir o usuário [${idMembro}]?`)) return;
    aplicarMutacaoLocalESincronizar(
      () => { STATE.membros = STATE.membros.filter(m => m.ID_Membro !== idMembro); },
      runner => runner.apiExcluirItem('MEMBRO', idMembro),
      'Excluir Usuário'
    );
  }

  function abrirCommandPalette() {
    document.getElementById('modalCommandPalette').classList.remove('hidden');
    document.getElementById('inputBuscaComando').focus();
    filtrarCommandPalette();
  }
  function fecharCommandPalette() {
    document.getElementById('modalCommandPalette').classList.add('hidden');
  }
  function filtrarCommandPalette() {
    const q = (document.getElementById('inputBuscaComando').value || '').toLowerCase();
    const cont = document.getElementById('listaResultadosComando');
    const itens = STATE.tarefas
      .filter(t => String(t.Titulo_Tarefa || '').toLowerCase().includes(q) || String(t.ID_Tarefa || '').toLowerCase().includes(q))
      .map(t => `<div style="padding:10px;border-bottom:1px solid var(--border);cursor:pointer;" onclick="fecharCommandPalette();abrirModalEditarTarefa('${escJs(t.ID_Tarefa)}')">📋 <strong>[${esc(t.ID_Tarefa)}]</strong> ${esc(t.Titulo_Tarefa)} (${esc(t.Status)}) — <em>Clique para editar</em></div>`);
    cont.innerHTML = itens.join('') || '<div style="padding:10px;color:var(--muted);">Nenhum resultado encontrado.</div>';
  }
</script>
